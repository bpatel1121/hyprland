# Night light. Lives at the repo root next to hypridle.conf for the same
# reason: a schedule is behavior, not visual identity, so it is not a theme's.
#
# Started from hyprland.lua's `hyprland.start` hook (silently skipped when
# hyprsunset isn't installed). Profiles are keyed by local time: the last one
# whose time has passed is the one in force, so the day runs neutral from 07:30
# and warms at 21:00. 4200K is a reading-lamp warm, not the orange of 3000K —
# the themes' palettes still read as themselves under it.

max-gamma = 100

profile {
    time = 07:30
    identity = true
}

profile {
    time = 21:00
    temperature = 4200
}
