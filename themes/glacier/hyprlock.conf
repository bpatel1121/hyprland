# Glacier · frost — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: ICE CYAN is the frame, WHITE is the
# content, red appears only on failure. White clock in a faint cyan bloom —
# cold light on ice, not neon.
#
# LAYOUT NOTE: the stack sits in the LOWER third (everything 210px further
# down than the centered layout of the other dark themes). The figure sits
# dead center on her throne, and the centered stack would put the clock across
# her chest and the input across her lap; this low, the stack crosses only
# her legs and the ice floor, and the cap, face and hair stay clear. Mirrored
# in sddm/Main.qml so login -> lock read as one design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.5 and a 10px blur, a notch past the other dark themes' 0.55/8: the
    # painting is bright ice, and this is the one screen where the figure is
    # seen in full, so it is frosted harder rather than dimmed into mud.
    blur_passes = 3
    blur_size = 10
    brightness = 0.5
    contrast = 1.05
}

# The clock: white glyphs in a wide, quiet ice-cyan bloom — the frame hue
# under the readout hue, the same pairing as the bar's clock. Boost stays
# under 1: calm, not loud.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(e8f4ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgb(5bd7fa)
    shadow_boost = 0.9
    position = 0, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(7f8fbf)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -170
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(7f8fbf)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -380
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(5bd7fa)
    inner_color = rgb(15295a)
    font_color = rgb(e8f4ff)
    # Checking: the ring goes white (readout) — a visible step up from the
    # cyan frame, the same lift the active workspace gets.
    check_color = rgb(e8f4ff)
    fail_color = rgb(ff6b81)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##7f8fbf">enter password</span>
    fail_text = <span foreground="##ff6b81">$FAIL</span>
    position = 0, -300
    halign = center
    valign = center
}
