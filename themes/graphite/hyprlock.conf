# Graphite · light — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: INK is the frame, ink is the type, and
# the VIOLET appears exactly where something is happening — the input while
# it checks. Red only on failure. A sketch's margin note, not a lit sign.
#
# LAYOUT NOTE: the stack sits in the RIGHT third (x = +480), not centered like
# the dark themes. The figure fills the left and center of the sketch and a
# centered input would land across the rifle; the right third is clean paper
# at every height. Mirrored in sddm/Main.qml so login -> lock read as one
# design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.92, not the dark themes' 0.55: this is near-white paper, and dimming it
    # that far turns it to slate. Two blur passes, not three — a pencil sketch
    # needs no heavy frosting, and the figure stays a silhouette.
    blur_passes = 2
    blur_size = 6
    brightness = 0.92
    contrast = 1.0
}

# The clock: flat ink glyphs, no shadow — pencil on paper. Ink on the 0.92-lit
# paper reads at ~13:1; dim and dormant would thin out here (they are the
# paper's own greys), so every label on the wallpaper is ink.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(2b2427)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 480, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(1d1719)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 480, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(1d1719)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 480, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 8
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(2b2427)
    inner_color = rgb(f6f3f5)
    font_color = rgb(1d1719)
    # Checking: the violet (readout) — the one hue, on the one thing being
    # acted on. It is the only outline that can read as "something happened"
    # against an ink rim.
    check_color = rgb(8a4f96)
    fail_color = rgb(c4475c)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##8f8181">enter password</span>
    fail_text = <span foreground="##c4475c">$FAIL</span>
    position = 480, -90
    halign = center
    valign = center
}
