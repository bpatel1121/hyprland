# lazygit — gruvbox. Orange frame, muted-sky readouts, no neon: the active
# panel border is the frame color, selection is a raised surface.
gui:
  nerdFontsVersion: "3"
  showRandomTip: false
  theme:
    activeBorderColor: ["#fe8019", "bold"]
    inactiveBorderColor: ["#665c54"]
    searchingActiveBorderColor: ["#fabd2f", "bold"]
    selectedLineBgColor: ["#3c3836"]
    optionsTextColor: ["#83a598"]
    cherryPickedCommitFgColor: ["#83a598"]
    cherryPickedCommitBgColor: ["#504945"]
    markedBaseCommitFgColor: ["#83a598"]
    markedBaseCommitBgColor: ["#fabd2f"]
    unstagedChangesColor: ["#fb4934"]
    defaultFgColor: ["#ebdbb2"]
