# Gruvbox · dark — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: ORANGE is the frame, AQUA/cream is the
# content, red appears only on failure. Cream clock, ember shadow — lamplight.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALLPAPER@
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
}

# The clock: flat cream glyphs, no shadow — matte print, not a lit sign. The
# background dim (brightness 0.55) is what carries the contrast.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(ebdbb2)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(928374)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 4
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(fe8019)
    inner_color = rgb(282828)
    font_color = rgb(ebdbb2)
    check_color = rgb(83a598)
    fail_color = rgb(fb4934)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##928374">enter password</span>
    fail_text = <span foreground="##fb4934">$FAIL</span>
    position = 0, -90
    halign = center
    valign = center
}
