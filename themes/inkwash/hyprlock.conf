# Inkwash · light — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: the GOLD FILIGREE is the frame, the
# OLIVE INK is the content, the cyan burst is the live color, red appears only
# on failure. Ink type on paper, a white-paper input with a 1px gold rim — a
# page from a sketchbook, not a lit sign.
#
# LAYOUT NOTE: the stack sits in the UPPER LEFT (x = -700, lifted 260px),
# not centered like the dark themes. The figure fills the center, and his
# shoulder plate reaches a quarter of the way across the screen below the
# midline — measured on the cover-cropped picture, the armor's left edge is at
# logical x ~450 level with the clock and ~250 level with where the dark
# themes put the input, so a left-THIRD stack at the usual heights would print
# the clock across black armor (2:1). The smoke wash is clear above y ~500:
# the stack lives there, and every label was checked against the 0.92-lit
# wash at >= 3.4:1. Mirrored in sddm/Main.qml so login -> lock read as one
# design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.92, not the dark themes' 0.55: this is a light field, and dimming it
    # that far turns the paper grey. Two blur passes, not three — a wash needs
    # no heavy frosting, and the figure stays a silhouette.
    blur_passes = 2
    blur_size = 6
    brightness = 0.92
    contrast = 1.0
}

# The clock: flat olive-ink glyphs, no shadow — ink on paper. The readout's
# olive on the 0.92-lit smoke reads at ~6:1 (3.4:1 in the darkest stroke under
# it); dim and dormant would vanish out here (they are smoke-colored), so
# every label on the wallpaper is an ink.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(3f4d2a)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = -700, 440
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(1c1b14)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -700, 360
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(1c1b14)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -700, 150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    # 1px, like every rim in this theme: a brush edge, not a frame.
    outline_thickness = 1
    rounding = 6
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: gold -> cape green at 45°, the window border.
    outer_color = rgb(c89a3e) rgb(6f9a3a) 45deg
    inner_color = rgb(f6f5f2)
    font_color = rgb(3f4d2a)
    # Checking: the burst's deep water (launcher), not readout — readout is the
    # olive ink here, the same ink as the dots, so an olive outline would read
    # as "nothing happened". The burst is the one lit color in the painting;
    # the launcher role is it printed, and a 1px ring in it still steps clear
    # of the gold rim.
    check_color = rgb(286884)
    fail_color = rgb(c0392b)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##8a8a7a">enter password</span>
    fail_text = <span foreground="##c0392b">$FAIL</span>
    position = -700, 230
    halign = center
    valign = center
}
