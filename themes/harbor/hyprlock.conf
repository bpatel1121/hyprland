# Harbor · dusk over water — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: AMBER is the frame AND the content, one
# hue at two weights; the SMOKE (the launcher's cyan) is the one cool flash,
# while the password is checked; red appears only on failure. An amber clock
# in a quiet amber bloom — lamplight, not neon.
#
# LAYOUT NOTE: the stack sits CENTRE-RIGHT, a little low (x = +230, and 210px
# further down than the centered layout of the other dark themes). The figure
# stands left of centre — measured on the panel's 16:10 crop her body spans
# x 12..36 % with her head in the top third, and the arm with the can reaches
# x 49 % at y 66..78 % — and the skyline fills y 12..49 % right of her, which
# is where the other dark themes' centered clock would sit. At x 62 % and
# this low, the stack crosses dark water and the railing in front of it:
# its left edge (x 52 %) clears the can by ~90px, the skyline ends above the
# clock, and the lamp post (x ~97 %) and the lit pavement (lower right) stay
# outside it. Measured over the dimmed, blurred picture: the clock (readout)
# 8.2:1 over 95 % of its box, 4.9:1 on the single brightest reflection; the
# date (dormant) 3.9:1 / 3.4:1; `locked` 5.3:1 everywhere. Mirrored in
# sddm/Main.qml so login -> lock read as one design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    # The dark themes' resting 0.55/8: the picture is already dusk, and the
    # stack sits over dark water, so it needs no extra dimming or frost.
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
}

# The clock: amber glyphs (readout, the hoodie lit) in a quiet bloom of the
# frame's mid amber — one hue at two weights, the same pairing as the bar's
# clock on its amber-rimmed island. Boost stays under 1: lamplight, not neon.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(f6c870)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgb(e0ab5a)
    shadow_boost = 0.8
    position = 230, -90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(62939f)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 230, -170
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(62939f)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 230, -380
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: the smoke (launcher) over amber (frame)
    # at 90° — the horizon in the ring. Inside, the skyline (surface).
    outer_color = rgb(82e0fa) rgb(e0ab5a) 90deg
    inner_color = rgb(172730)
    font_color = rgb(f6c870)
    # Checking: the whole ring goes the smoke (launcher) — the one cool flash
    # on an amber screen, the sky filling the ring while the password is read.
    check_color = rgb(82e0fa)
    fail_color = rgb(eb4030)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##62939f">enter password</span>
    fail_text = <span foreground="##eb4030">$FAIL</span>
    position = 230, -300
    halign = center
    valign = center
}
