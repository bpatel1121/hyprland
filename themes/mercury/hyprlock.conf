# Mercury · liquid metal on true black — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: CHROME is the frame, SILVER is the
# content, and state is told by weight, never hue — the ring brightens to
# `warn` while the password is checked (pending, a step up from the silver)
# and goes white-hot (urgent) on failure. A silver clock in a faint chrome
# bloom: the metal catching light, not neon.
#
# LAYOUT NOTE: the stack sits LEFT of centre (x = -538, so x ≈ 22 %) and
# vertically centred, over pure black. The figure is centre-right — measured
# on the panel's 16:10 crop (which takes ~232px off each side of the
# 4625-wide picture) the metal spans x 40..75 % with the head at y 37..60 %
# and the shoulders running off the bottom edge — so the centred stack of
# the other dark themes would cross the face. At x 22 % the stack (x 14..30 %)
# clears the figure by a tenth of the screen and every pixel under it is the
# black (mean #000000, p99.9 = 3): only the specks, single bright pixels, lie
# there, and at brightness 0.7 with the 8px blur they go to #010101. So the
# ratios under the stack are the ratios on black: the clock (readout) 10.1:1,
# the date and `locked` (dormant) 6.2:1, the ring (frame) 15.6:1, the failure
# line (urgent) 21:1. 0.7, not 0.55: black does not dim, and what the
# brightness is for is the figure's highlights, a little. Mirrored in
# sddm/Main.qml so login -> lock read as one design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.7 with the dark themes' 8px blur: the ground is true black and stays
    # black at any brightness; this takes the edge off the figure's specular
    # whites so the lock reads as the metal under lower light.
    blur_passes = 3
    blur_size = 8
    brightness = 0.7
    contrast = 1.0
}

# The clock: silver glyphs (readout) in a faint bloom of chrome (frame) — the
# same pairing as the bar's clock on its chrome-rimmed island. Boost well
# under 1: metal catching light, not neon.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(b4b4b4)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgb(dedede)
    shadow_boost = 0.5
    position = -538, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(8c8c8c)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -538, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(8c8c8c)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -538, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 10
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: chrome (frame) -> silver (readout) at
    # 45°. Inside, the metal's shadow side (surface).
    outer_color = rgb(dedede) rgb(b4b4b4) 45deg
    inner_color = rgb(101010)
    font_color = rgb(b4b4b4)
    # Checking: the whole ring brightens to `warn` — pending, told by weight:
    # the metal heats a step while the password is read. Failure is pure
    # white (urgent), the only thing brighter than the frame.
    check_color = rgb(c8c8c8)
    fail_color = rgb(ffffff)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##8c8c8c">enter password</span>
    fail_text = <span foreground="##ffffff">$FAIL</span>
    position = -538, -90
    halign = center
    valign = center
}
