# Mercury · liquid metal on true black — starship
#
# theme-apply.sh symlinks this to ~/.config/starship.toml.
#
# COLORS ARE ANSI SLOT NAMES, NOT HEX. A prompt painted in 24-bit hex is baked
# into the terminal cells, so after SUPER+T every prompt already on screen kept
# the old theme's colors. Slot names (red, cyan, bright-purple...) resolve
# through WezTerm's live palette, which theme-apply.sh recolors in place, so
# old prompts flip with the rest of the screen. Which slot carries which role
# is this theme's wezterm/colors.lua — read the two together.
#
# Same minimal one-line layout as the others, palette re-cast for metal with
# no hue — the prompt is grey at three weights:
#   path    text     default fg      where you are
#   branch  chrome   bright-purple   what you're on (the frame color)
#   arrow   silver   white           where you type  (dull red when the last cmd failed —
#                                    the readout's slot is `white` here, not cyan:
#                                    cyan is the terminal's grey-teal, a hue)
#   dirty ● sand     yellow          uncommitted work exists
#   venv 󰌠  silver   white           a virtualenv is active (glyph only, no name)
#
# The two hues — the dirty dot and the failed arrow — are the terminal's one
# exception, as in manga: git and a failed command mean something by color,
# and that is exactly what the terminal keeps its muted hues for
# (wezterm/colors.lua). Everything else on the prompt is a weight.
#
# Glyph choices (󰘬 ● ❯ ❮ ↑ ↓ ×) are the JetBrainsMono-Nerd-Font-verified set
# from the cyberpunk config — see its comments before "fixing" any of them.

# The literal space before $character is load-bearing (see cyberpunk config).
format = "$conda${custom.venv}$directory$git_branch${custom.git_dirty} $character"
add_newline = true

[directory]
style = "bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " ro"
read_only_style = "fg:red"

[git_branch]
symbol = "󰘬 "
style = "fg:bright-purple"
format = "  [$symbol$branch]($style)"

# Off in favour of the single dirty dot below (same reasoning as cyberpunk).
[git_status]
disabled = true

# One sand dot when the working tree has anything uncommitted, nothing when
# clean. Do NOT add a `shell = [...]` key and keep the `when` condition — see
# the cyberpunk config for why both matter.
[custom.git_dirty]
description = "one dot when there are uncommitted changes"
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
command = "printf ●"
style = "fg:yellow"
format = " [$output]($style)"

# Leading chip when a virtualenv is active, nothing when one isn't. Ahead of
# $directory so a glance down the left edge says which shells are in an env,
# without costing the path a character. Symbol only, no venv name. Takes the
# readout weight (the arrow's), not the frame — "an env is live" is state
# being reported, and the chrome stays the branch's. See the cyberpunk config
# for the full reasoning and the note on why there is no `shell` key.
#
# 󰌠 is nf-md-language_python (U+F0320) — same Material Design block as 󰘬.
[custom.venv]
description = "one glyph when a python virtualenv is active"
when = 'test -n "$VIRTUAL_ENV"'
command = "printf 󰌠"
style = "fg:white"
format = "[$output]($style) "

# Silver on success — the readout weight everywhere in this theme — and the
# dull red on failure: far enough apart in peripheral vision, which is all
# the arrow has to be. Not the chrome: that is the branch's, and the arrow is
# a readout, not a frame.
[character]
success_symbol = "[❯](fg:white)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:bright-black)"

# Everything else off — this is the "minimal" part.
[cmd_duration]
disabled = true
[package]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[docker_context]
disabled = true

# The conda glyph is nf-dev-python (U+E715), written as a TOML escape rather
# than the raw private-use character the older configs carry. Silver, like
# the venv chip: an env is state, not a frame.
[conda]
symbol = ""
ignore_base = false
style = "fg:white"
format = "[$symbol]($style) "
