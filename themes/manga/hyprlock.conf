# Manga · light — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: INK is the frame, ink is the type, and
# state is told by weight, never hue — the ring goes to the mid grey (warn, the
# pending weight) while the password is checked, and pure ink (urgent) on
# failure. A printed panel's caption, not a lit sign.
#
# LAYOUT NOTE: the stack sits LEFT of centre (x = -480, so x ≈ 25 %) and
# vertically centred, on blank page. The figure stands right of centre —
# measured on the panel's 16:10 crop she spans x 70..94 % (a stray line to
# 98 %) and y 19..97 %, so the centred stack of the dark themes would cross her
# blades and graphite's lower-right one her skirt. At x 25 % the stack
# (x 17..33 %) clears her by more than a third of the screen and sits on the
# flat page (every pixel under it is the paper, #f6f6f6). Every label was
# checked against the 0.95-lit page: ink 15.7:1, type 15.0:1, the mid ink
# 7.4:1, dormant 3.8:1. Mirrored in sddm/Main.qml so login -> lock read as one
# design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.95, not the dark themes' 0.55: this is an off-white page, and dimming
    # it that far turns it to slate (graphite's reasoning; whiter still here).
    # Two blur passes, not three — flat line art needs no heavy frosting, and
    # the figure stays a silhouette.
    blur_passes = 2
    blur_size = 6
    brightness = 0.95
    contrast = 1.0
}

# The clock: flat ink glyphs, no shadow — print on paper. Ink on the 0.95-lit
# page reads at ~16:1; dim and dormant would thin out here (they are the
# page's own greys), so every label on the wallpaper is ink.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(111111)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = -480, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(161616)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -480, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(161616)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -480, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 4
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: ink -> mid ink at 45°, the window border.
    # Inside, the clean page (surface).
    outer_color = rgb(111111) rgb(4a4a4a) 45deg
    inner_color = rgb(f5f5f5)
    font_color = rgb(161616)
    # Checking: the whole ring goes the mid grey (warn) — pending, told by
    # weight: the line lightens a step while the password is read. Failure
    # is pure ink (urgent), the one thing darker than the frame.
    check_color = rgb(5c5c5c)
    fail_color = rgb(000000)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##858585">enter password</span>
    fail_text = <span foreground="##000000">$FAIL</span>
    position = -480, -90
    halign = center
    valign = center
}
