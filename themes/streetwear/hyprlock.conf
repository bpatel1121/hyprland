# Streetwear · light — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: the yellow TAG is the frame, NAVY is the
# content, pink appears only on failure. Navy type on sky, a paper input with
# a tag-yellow edge — a lookbook page, not a lit sign.
#
# LAYOUT NOTE: the stack sits in the LEFT third (x = -480), not centered like
# the other two themes. The figure stands dead center and the centered input
# would land across her eyes; the left third is flat sky at every height.
# Mirrored in sddm/Main.qml so login -> lock read as one design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.9, not the dark themes' 0.55: this is a light field, and dimming it
    # that far turns periwinkle into mud. Two blur passes, not three — a flat
    # sky needs no heavy frosting, and the figure stays a silhouette.
    blur_passes = 2
    blur_size = 6
    brightness = 0.9
    contrast = 1.0
}

# The clock: flat navy glyphs, no shadow — ink on sky. Navy on the 0.9-lit
# periwinkle reads at ~4.3:1; dim and dormant would vanish out here (they are
# sky-colored), so every label on the wallpaper is navy.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(13202a)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = -480, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(1b2630)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -480, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(1b2630)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -480, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 10
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(e9b92a)
    inner_color = rgb(fbf8f2)
    font_color = rgb(13202a)
    # Checking: teal (the eyes), not readout — readout is navy here, the same
    # ink as the font, so a navy outline would read as "nothing happened".
    check_color = rgb(2f8f74)
    fail_color = rgb(d6476a)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##7d8aa0">enter password</span>
    fail_text = <span foreground="##d6476a">$FAIL</span>
    position = -480, -90
    halign = center
    valign = center
}
