# lazygit — streetwear. Yellow tag frame, navy readouts, no neon: the active
# panel border is the frame color (a line, so the tag's yellow can carry it),
# selection is a raised paper band, and the marked base commit is a yellow tag
# with navy print — the same block the bar's active workspace wears.
gui:
  nerdFontsVersion: "3"
  showRandomTip: false
  theme:
    activeBorderColor: ["#e9b92a", "bold"]
    inactiveBorderColor: ["#7d8aa0"]
    searchingActiveBorderColor: ["#e07a2e", "bold"]
    selectedLineBgColor: ["#e3dcd0"]
    optionsTextColor: ["#13202a"]
    cherryPickedCommitFgColor: ["#13202a"]
    cherryPickedCommitBgColor: ["#efe9df"]
    markedBaseCommitFgColor: ["#13202a"]
    markedBaseCommitBgColor: ["#e9b92a"]
    unstagedChangesColor: ["#d6476a"]
    defaultFgColor: ["#1b2630"]
