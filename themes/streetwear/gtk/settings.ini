# Streetwear · light — GTK settings
#
# Symlinked by theme-apply.sh to ~/.config/gtk-3.0/settings.ini and
# ~/.config/gtk-4.0/settings.ini. Duplicates the gsettings theme-apply also
# sets, deliberately: GTK3 apps launched outside a portal/dconf session read
# this ini and never consult gsettings. The light names here are the same ones
# theme-apply resolves from `polarity = "light"` (adw-gtk3, not -dark;
# Papirus-Light; prefer-dark-theme off).

[Settings]
gtk-theme-name=adw-gtk3
gtk-icon-theme-name=Papirus-Light
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-font-name=JetBrainsMono Nerd Font 11
gtk-application-prefer-dark-theme=0
gtk-decoration-layout=appmenu:
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
