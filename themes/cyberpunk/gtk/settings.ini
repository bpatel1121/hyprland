# Cyberpunk · Cybrcolors — GTK settings
#
# Symlinked by theme-apply.sh to ~/.config/gtk-3.0/settings.ini and
# ~/.config/gtk-4.0/settings.ini. This duplicates what theme-apply also sets via
# gsettings, and that duplication is deliberate: GTK3 apps started outside a
# portal/dconf session read this ini and never consult gsettings, so setting
# only one of the two leaves apps unthemed depending on how they were launched.

[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=capitaine-cursors
gtk-cursor-theme-size=24
gtk-font-name=JetBrainsMono Nerd Font 11
gtk-application-prefer-dark-theme=1
gtk-decoration-layout=appmenu:
gtk-enable-animations=1
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
