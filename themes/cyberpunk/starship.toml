# Cyberpunk · Cybrcolors — starship
#
# theme-apply.sh symlinks this to ~/.config/starship.toml.
#
# COLORS ARE ANSI SLOT NAMES, NOT HEX. A prompt painted in 24-bit hex is baked
# into the terminal cells, so after SUPER+T every prompt already on screen kept
# the old theme's colors. Slot names (red, cyan, bright-purple...) resolve
# through WezTerm's live palette, which theme-apply.sh recolors in place, so
# old prompts flip with the rest of the screen. Which slot carries which role
# is this theme's wezterm/colors.lua — read the two together.
#
# Minimal: one line, no powerline chips, no backgrounds. Distinct colors so
# nothing blurs together —
#   path    bright fg  default fg   where you are
#   branch  pink       bright-purple   what you're on
#   arrow   cyan       cyan   where you type  (red when the last cmd failed)
#   venv 󰌠  cyan       cyan   a virtualenv is active (glyph only, no name)
#
# Git state is the one place color carries meaning rather than identity:
#   ✓  green   clean AND in sync with upstream — nothing to do
#   ●N amber   N files modified but not staged  — you have changes to commit
#   +N green   N staged and ready
#   ?N gray    N untracked
#   ×N red     N deleted        !N red  conflicts        ≡ violet  stashed
#   ↑N ↓N cyan ahead / behind upstream — commit exists, needs push/pull
#   ↕a/b  red  diverged
#
# Every glyph here was checked against JetBrainsMono Nerd Font. The usual
# starship defaults ⇡ ⇣ ✘ are NOT in this font and render as fallback junk —
# ↑ ↓ × are, so those are used instead. Don't "fix" them back.

# The literal space before $character is load-bearing: every git segment is
# conditional, so without it the arrow butts straight against the directory
# outside a repo ("/tmp❯") and against the status counts inside one ("●1❯").
format = "$conda${custom.venv}$directory$git_branch${custom.git_dirty} $character"
add_newline = true

[directory]
style = "bold"
format = "[$path]($style)"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = true
read_only = " ro"
read_only_style = "fg:red"

[git_branch]
symbol = "󰘬 "
style = "fg:bright-purple"
format = "  [$symbol$branch]($style)"

# Off in favour of the single dot below. This module gives per-category counts
# (●3 +1 ?2 …), which is more detail than the prompt wants — btop-for-git when
# `git status` is one keystroke away.
[git_status]
disabled = true

# One amber dot when the working tree has anything uncommitted, and nothing at
# all when it's clean — so a tidy repo looks exactly like no repo, and the dot
# only ever means "you have work to commit".
#
# `git status --porcelain` prints one line per change (modified, staged,
# deleted, untracked) and nothing when clean, so a plain emptiness test covers
# every case in a single call. Outside a repo it errors, output is empty, and
# the module stays hidden — no separate "am I in a repo" check needed.
#
# Untracked files count as dirty. If a repo with lots of build junk keeps the
# dot permanently lit, add `--untracked-files=no` here.
#
# Do NOT add a `shell = [...]` key. Starship pipes the command to the shell on
# stdin, so `sh -c` receives nothing and the module silently never renders —
# verified by testing all three variants. Omitting `shell` works. `when` is
# also required: a custom module with no condition never shows at all.
[custom.git_dirty]
description = "one dot when there are uncommitted changes"
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
command = "printf ●"
style = "fg:yellow"
format = " [$output]($style)"

# Leading chip when a virtualenv is active, nothing at all when one isn't — so
# the prompt only ever grows when there is something true to say. It sits ahead
# of $directory rather than after it because prompts start at a fixed column:
# one glance down the left edge tells you which shells are in an env, without
# reading a single path or losing a character of it.
#
# Symbol only, no venv name. Which env it is is nearly always the repo you are
# standing in, and that is already on the line; `echo $VIRTUAL_ENV` covers the
# rare case where it isn't.
#
# cy0 cyan is this theme's readout color (see theme.lua) — the same role the
# arrow plays. Frame colors identify, readout colors report; "an env is live"
# is a report, so it takes cyan and leaves pink to the branch.
#
# Same rules as custom.git_dirty: no `shell` key, and `when` is required.
#
# 󰌠 is nf-md-language_python (U+F0320) — same Material Design block as the
# 󰘬 branch glyph above, so if that renders, this does. If it ever boxes,
# ● in cyan reads fine as "env live" too.
[custom.venv]
description = "one glyph when a python virtualenv is active"
when = 'test -n "$VIRTUAL_ENV"'
command = "printf 󰌠"
style = "fg:cyan"
format = "[$output]($style) "

# Cyan rather than pink on success, specifically so failure reads at a glance.
# Cyan is red's direct complement — the largest hue separation there is — where
# pink and red are near neighbours and easy to miss in peripheral vision. Cyan
# over bl0 blue for the same job: blue only manages 4:1 contrast on this
# background, cyan is roughly twice that, so the resting state stays legible.
[character]
success_symbol = "[❯](fg:cyan)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:white)"

# Everything else off — this is the "minimal" part.
[cmd_duration]
disabled = true
[package]
disabled = true
[nodejs]
disabled = true
[python]
disabled = true
[rust]
disabled = true
[golang]
disabled = true
[docker_context]
disabled = true

[conda]
symbol = ""
ignore_base = false
style = "fg:green"
format = "[$symbol]($style) "
