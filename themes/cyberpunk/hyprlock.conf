# Cyberpunk · Cybrcolors — hyprlock
#
# TEMPLATE, not a live config. scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted for the active
# theme's wallpaper. It is rendered rather than symlinked because hyprlang
# can't be relied on to expand $HOME, and this repo deliberately keeps absolute
# user paths out of tracked files (see the note about the relative `current`
# symlink in README.md). The rendered copy is gitignored.
#
# Palette discipline matches waybar: PINK is the frame, CYAN is the content,
# red appears only on failure.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.1
}

# The clock: cyan glyphs in a pink bloom — the same pairing as the waybar clock,
# where the glow hue matches the frame rather than the text.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(29BECC)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgb(F230B2)
    shadow_boost = 1.4
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(898D99)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Terminal-noir theater under the input.
label {
    monitor =
    text = S Y S T E M   L O C K E D
    color = rgb(F230B2)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgb(F230B2)
    shadow_boost = 0.8
    position = 0, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 14
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: amber -> pink at 45°, the window border.
    outer_color = rgb(F2D230) rgb(F230B2) 45deg
    inner_color = rgb(0A0E1A)
    font_color = rgb(C8D0E0)
    check_color = rgb(29BECC)
    fail_color = rgb(F24848)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##898D99">enter password</span>
    fail_text = <span foreground="##F24848">$FAIL</span>
    position = 0, -90
    halign = center
    valign = center
}
