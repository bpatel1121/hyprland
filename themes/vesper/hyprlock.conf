# Vesper · rim light on cobalt — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: RIM RED is the frame, PEACH is the
# content, the sky LIT (ok) is the ring while the password is checked — state
# in the ground's own hue, more sky, not a foreign color — and crimson appears
# only on failure. A peach clock in a faint red bloom — the horizon, not neon.
#
# LAYOUT NOTE: the stack sits LEFT of centre (x = -384, so x ≈ 30 %) and a
# little low (60px under the centred layout of cyberpunk and gruvbox, so the
# stack's centre is at y ≈ 55 %). The figure hangs right of centre — measured
# on the panel's 16:10 crop she spans x 67..88 % with her head at the top edge
# and her feet at y ≈ 90 % — so the centred stack would cross her skirt, and
# harbor's centre-right one her legs. At x 30 % the stack (x 22..38 %) clears
# her by a quarter of the screen and crosses only open sky and the horizon
# haze, where nothing is painted. The haze is the catch: it is the brightest
# band of the sky, and at the night themes' brightness 0.55 dormant type on
# it is 2.6:1, the ring 2.1:1. So this theme dims deeper, 0.35: measured over
# the dimmed, blurred picture the clock (readout) holds 7.3:1 everywhere in
# its box, the date (dormant) 4.2:1, `locked` 3.9:1, the ring (frame) 3.5:1
# and the failure line (urgent) 3.1:1 — the brightest pixel under the stack
# (#413937) is a step above `surface`, which is why 0.35 and not 0.4 (where
# the failure line is 2.7:1). Mirrored in sddm/Main.qml so login -> lock read
# as one design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    # 0.35 with the dark themes' 8px blur: this picture is a lit dusk, not a
    # night, and the stack sits over the horizon haze — see the LAYOUT NOTE.
    # Dusk going to night, which is what the name says.
    blur_passes = 3
    blur_size = 8
    brightness = 0.35
    contrast = 1.05
}

# The clock: peach glyphs (readout, the horizon) in a faint bloom of the rim
# (frame) — the same pairing as the bar's clock on its rim-edged island.
# Boost well under 1: a sun below the horizon, not neon.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(eebfa6)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgb(f25a3c)
    shadow_boost = 0.6
    position = -384, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(839aab)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -384, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(839aab)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -384, -230
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 10
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: rim (frame) -> peach (readout) at 0°,
    # red on the left fading to peach on the right, light from the right.
    # Inside, the cobalt (surface).
    outer_color = rgb(f25a3c) rgb(eebfa6) 0deg
    inner_color = rgb(102a4e)
    font_color = rgb(eebfa6)
    # Checking: the whole ring goes the sky lit (ok) — the cobalt brightening
    # while the password is read. State in the ground's hue, more sky.
    check_color = rgb(7fbdea)
    fail_color = rgb(ee4068)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##839aab">enter password</span>
    fail_text = <span foreground="##ee4068">$FAIL</span>
    position = -384, -150
    halign = center
    valign = center
}
