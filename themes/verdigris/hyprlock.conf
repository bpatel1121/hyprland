# Verdigris · candlelit stone — hyprlock
#
# TEMPLATE, not a live config: scripts/theme-apply.sh renders this to
# ~/.config/hypr/hyprlock.conf with @WALLPAPER@ substituted (same mechanism
# and reasons as the cyberpunk template — no absolute user paths in git).
#
# Palette discipline matches the bar: WITCHLIGHT is the frame, BONE is the
# content, the witchlight LIT (ok) is the ring while the password is checked —
# more light, not a foreign color — and red appears only on failure. A bone
# clock in a faint witchlight bloom — a window at night, not neon.
#
# LAYOUT NOTE: the stack sits on the LEFT THIRD (x = -570), vertically
# centred like the other dark themes. The castle fills the right half of the
# picture (x 55..85 %), the dragon is top-centre-right, the gargoyles top-left,
# and the bridge and the lit water are bottom-centre — so the centred stack of
# the other dark themes would cross the lit gate and the water. At x 20 % it
# sits over the dark cliff face, where nothing is lit: measured over the
# dimmed, blurred picture, the clock (readout) 12.7:1 everywhere in its box,
# the date (dormant) 6.0:1, `locked` 5.9:1, the ring (frame) 5.9:1 and the
# failure line (urgent) 4.2:1 — the brightest pixel under the whole stack is
# darker than `surface`. Mirrored in sddm/Main.qml so login -> lock read as
# one design.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# Ease in and out instead of appearing in one frame, like every other surface
# on this desktop. The curves mirror hyprland.lua's: easeOutQuint in, linear
# out; the dots and the ring's color changes ease the same way. Speeds are in
# deciseconds, as Hyprland's are.
animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, easeOutQuint
    animation = inputFieldColors, 1, 3, easeOutQuint
}

background {
    monitor =
    path = @WALLPAPER@
    # The dark themes' resting 0.55/8: the picture is already night, and the
    # stack sits over the dark cliff, so it needs no extra dimming or frost.
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    contrast = 1.05
}

# The clock: bone glyphs (readout, the window light) in a faint bloom of the
# witchlight (frame) — the same pairing as the bar's clock on its
# witchlight-rimmed island. Boost well under 1: a candle, not neon.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cfdcc3)
    font_size = 96
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgb(7ea763)
    shadow_boost = 0.6
    position = -570, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(8c9a74)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -570, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = — locked —
    color = rgb(8c9a74)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = -570, -170
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 6
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    # The ring is the window border: witchlight (frame) -> bone (readout) at
    # 45°, the gate's light meeting the window's. Inside, the stone (surface).
    outer_color = rgb(7ea763) rgb(cfdcc3) 45deg
    inner_color = rgb(202928)
    font_color = rgb(cfdcc3)
    # Checking: the whole ring goes the witchlight lit (ok) — the gate
    # brightening while the password is read. More light, the one hue.
    check_color = rgb(a6d98a)
    fail_color = rgb(d05f51)
    fade_on_empty = false
    # `##` is hyprlang's escape for a literal `#` — a bare one starts a comment.
    placeholder_text = <span foreground="##8c9a74">enter password</span>
    fail_text = <span foreground="##d05f51">$FAIL</span>
    position = -570, -90
    halign = center
    valign = center
}
