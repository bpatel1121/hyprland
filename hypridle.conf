# Idle behavior. Lives at the repo root next to hyprland.lua rather than in a
# theme, because timeouts are behavior, not visual identity — same reasoning
# that keeps binds and the waybar blur layer rule out of themes/.
#
# Started from hyprland.lua's `hyprland.start` hook. The lock screen it invokes
# is themed: themes/current/hyprlock.conf, rendered by scripts/theme-apply.sh.

general {
    # `pidof hyprlock ||` guards against stacking a second lock screen on top of
    # an existing one, which is the usual way to end up unable to type into it.
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 5 min — dim the backlight. brightnessctl -s saves the current level so -r can
# restore whatever it actually was, rather than guessing a value.
listener {
    timeout   = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 10 min — lock.
listener {
    timeout   = 600
    on-timeout = loginctl lock-session
}

# 15 min — screen off.
listener {
    timeout   = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}
