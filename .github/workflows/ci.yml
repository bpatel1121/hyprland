name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here can launch Hyprland, so CI's job is to catch the failures that
# are otherwise only visible as "the bar module silently vanished" or "the
# cursor quietly stopped switching" on a live desktop.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A self-managed interpreter, so PEP 668's externally-managed-environment
      # can never apply. Pinned >=3.11 for tomllib, which the TOML step imports.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck lua5.4
          # PySide6 ships a current qmllint; Ubuntu's apt one is Qt 6.4, which
          # rejects --uncreatable-type / --unresolved-type as unknown options.
          python -m pip install --quiet json5 tinycss2 jsonschema PySide6-Essentials

      # -x follows sourced libraries; -P scripts is what lets it resolve the
      # computed `. "$(dirname -- "${BASH_SOURCE[0]}")/x-lib.sh"` form.
      # Default severity, deliberately: -S warning used to hide the SC2012
      # `ls | head` findings that this repo actually had.
      - name: Shellcheck all scripts
        run: shellcheck -x -P scripts scripts/*.sh

      # `scripts/*-lib.sh` is sourced-only and ships 644; everything else is an
      # entry point and ships 755. Read from the INDEX, not the filesystem —
      # the index mode is what actually travels in a clone.
      - name: Script hygiene (shebang + the *-lib.sh convention)
        run: |
          bad=0
          for f in scripts/*.sh; do
            head -n1 "$f" | grep -qx '#!/usr/bin/env bash' \
              || { echo "FAIL $f: line 1 is not '#!/usr/bin/env bash'"; bad=1; }
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            case "$f" in
              *-lib.sh) want=100644 ;;
              *)        want=100755 ;;
            esac
            [ "$mode" = "$want" ] || { echo "FAIL $f: git mode $mode, want $want"; bad=1; }
          done
          exit $bad

      - name: Lua syntax (hyprland.lua + every theme.lua / colors.lua)
        run: |
          luac5.4 -p hyprland.lua && echo "OK hyprland.lua"
          for f in themes/*/theme.lua themes/*/wezterm/colors.lua; do
            # An explicit `if`, not `[ -f "$f" ] && ... && ...`: this loop is the
            # last command in the block, so under `bash -e` a final iteration
            # whose test simply failed made the whole STEP exit 1 — turning a
            # theme that legitimately omits colors.lua into a CI failure.
            if [ -f "$f" ]; then
              luac5.4 -p "$f" && echo "OK $f"
            fi
          done

      # Pinned release rather than a third-party action: no supply-chain surface
      # and reproducible. Honors .stylua.toml and .styluaignore — the theme
      # palette files are hand-aligned and deliberately excluded there; this
      # gate exists to keep hyprland.lua, which IS code, from drifting.
      - name: Lua formatting (stylua --check)
        run: |
          ver=2.0.2
          curl -sSfL -o /tmp/stylua.zip \
            "https://github.com/JohnnyMorganz/StyLua/releases/download/v$ver/stylua-linux-x86_64.zip"
          unzip -qo /tmp/stylua.zip -d /tmp
          chmod +x /tmp/stylua
          /tmp/stylua --check .

      - name: Themes declare a valid, complete table
        run: |
          for f in themes/*/theme.lua; do
            THEME_FILE="$f" lua5.4 -e '
              local f = os.getenv("THEME_FILE")
              local t = dofile(f)
              local function fail(m) io.stderr:write(f..": "..m.."\n"); os.exit(1) end
              if type(t) ~= "table" then fail("did not return a table") end
              for _, k in ipairs{"gaps_in","gaps_out","border_size","rounding",
                                 "active_border","inactive_border"} do
                if t[k] == nil then fail("missing required key: "..k) end
              end
              local ab = t.active_border
              if type(ab) ~= "table" or type(ab.colors) ~= "table" or #ab.colors < 1 then
                fail("active_border must be { colors = {...}, angle = n }")
              end
              -- border-motion.sh re-dofiles this and mutates ab.angle, so the
              -- gradient SHAPE has to hold, not just the key being present.
              for _, c in ipairs(ab.colors) do
                if not tostring(c):match("^rgba%(%x%x%x%x%x%x%x%x%)$") then
                  fail("active_border color not rgba(RRGGBBAA): "..tostring(c))
                end
              end
              if not tostring(t.inactive_border):match("^rgba%(%x%x%x%x%x%x%x%x%)$") then
                fail("inactive_border not rgba(RRGGBBAA)")
              end
              -- border_motion is divided into 7200 by border-motion.sh
              if t.border_motion ~= nil and (type(t.border_motion) ~= "number" or t.border_motion < 1) then
                fail("border_motion must be a positive number (deciseconds/revolution)")
              end
              if t.polarity ~= nil and t.polarity ~= "light" and t.polarity ~= "dark" then
                fail("polarity must be \"light\" or \"dark\"")
              end
              if t.cursor ~= nil and type(t.cursor) ~= "string" then fail("cursor must be a string") end
              if t.dim_strength ~= nil and (type(t.dim_strength) ~= "number"
                 or t.dim_strength < 0 or t.dim_strength > 1) then
                fail("dim_strength must be a number in 0..1")
              end
              print("OK "..f)
            '
          done

      # theme-lib.sh reads theme.lua with sed, so the keys it needs must sit at
      # the start of their own line. A purely cosmetic edit — folding
      # `cursor = "..."` onto a shared line the way gaps_in/gaps_out already
      # share one — would silently make theme-apply stop seeing the key, and
      # present as "the cursor randomly stopped switching". Round-trip the sed
      # against real Lua values so the format's real constraint is executable.
      - name: theme.lua keys stay sed-extractable (guards theme-apply.sh)
        run: |
          bad=0
          for f in themes/*/theme.lua; do
            for k in cursor border_motion polarity; do
              lua=$(THEME_FILE="$f" KEY="$k" lua5.4 -e 'local t = dofile(os.getenv("THEME_FILE"))
                       local v = t[os.getenv("KEY")]
                       io.write(v ~= nil and tostring(v) or "")')
              sedv=$(sed -n "s/^[[:space:]]*$k[[:space:]]*=[[:space:]]*\"\{0,1\}\([^\",]*\)\"\{0,1\}.*/\1/p" "$f" | head -n1)
              if [ "$lua" = "$sedv" ]; then
                echo "OK $f: $k=[$lua]"
              else
                echo "FAIL $f: $k — lua='$lua' but theme-apply's sed sees '$sedv'"; bad=1
              fi
            done
          done
          exit $bad

      # A renamed script would otherwise silently kill a bar module or a bind,
      # with CI still green: nothing verifies these paths today.
      - name: Every referenced script exists
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          bad = False
          srcs = [p for p in (['hyprland.lua', 'waybar/config.jsonc']
                              + glob.glob('themes/*/waybar/config.jsonc')
                              + glob.glob('scripts/*.sh')) if os.path.isfile(p)]
          pats = [re.compile(r'/\.config/hypr/scripts/([A-Za-z0-9._-]+\.sh)'),
                  re.compile(r'\$(?:HYPR|REPO|\{HYPR\})/scripts/([A-Za-z0-9._-]+\.sh)'),
                  re.compile(r'BASH_SOURCE\[0\]\}"\)/([A-Za-z0-9._-]+\.sh)'),
                  re.compile(r'scripts \.\. "([A-Za-z0-9._-]+\.sh)"')]
          seen = 0
          for s in srcs:
              text = open(s).read()
              for pat in pats:
                  for name in sorted(set(pat.findall(text))):
                      seen += 1
                      if not os.path.isfile(os.path.join('scripts', name)):
                          print(f'FAIL {s}: references missing scripts/{name}'); bad = True
          print(f'checked {seen} script references across {len(srcs)} files')
          sys.exit(1 if bad else 0)
          PY

      - name: JSONC / JSON / TOML parse
        run: |
          python3 - <<'PY'
          import glob, json, json5, tomllib
          for f in (['waybar/config.jsonc'] + glob.glob('themes/*/waybar/config.jsonc')
                    + glob.glob('themes/*/fastfetch/config.jsonc')):
              json5.load(open(f)); print('OK', f)
          for f in glob.glob('swaync/config.json'):
              json.load(open(f)); print('OK', f)
          for f in glob.glob('themes/*/starship.toml'):
              tomllib.load(open(f, 'rb')); print('OK', f)
          PY

      # wlogout's layout is a STREAM of objects, not a JSON array — parse it
      # one object at a time or it fails for the wrong reason.
      - name: wlogout layout is well-formed
        run: |
          python3 - <<'PY'
          import glob, json, sys
          bad = False
          for f in ['wlogout/layout'] + glob.glob('themes/*/wlogout/layout'):
              try:
                  dec, text, i, n = json.JSONDecoder(), open(f).read(), 0, 0
                  while (i := text.find('{', i)) != -1:
                      obj, i = dec.raw_decode(text, i)
                      for k in ('label', 'action', 'text', 'keybind'):
                          assert k in obj, f'button missing "{k}": {obj}'
                      n += 1
                  print(f'OK {f} ({n} buttons)')
              except Exception as e:
                  print(f'FAIL {f}: {e}'); bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: CSS parse (waybar / wofi / wlogout / gtk / swaync / swayosd)
        run: |
          python3 - <<'PY'
          import glob, tinycss2
          files = []
          for pat in ['themes/*/waybar/style.css','themes/*/wofi/style.css',
                      'themes/*/wlogout/style.css','themes/*/gtk/gtk.css',
                      'themes/*/swaync/style.css','themes/*/swayosd/style.css']:
              files += glob.glob(pat)
          bad = False
          for f in files:
              errs = [r for r in tinycss2.parse_stylesheet(open(f).read()) if r.type == 'error']
              print(('FAIL' if errs else 'OK'), f, errs[:1] if errs else '')
              bad = bad or bool(errs)
          raise SystemExit(1 if bad else 0)
          PY

      - name: Layer-shell CSS safety rules (no outer box-shadow, no `transparent`)
        run: |
          python3 - <<'PY'
          import glob, re, sys
          bad = False
          def code(f):  # css with comments stripped
              return re.sub(r'/\*.*?\*/', '', open(f).read(), flags=re.S)
          for f in glob.glob('themes/*/waybar/style.css') + glob.glob('themes/*/wlogout/style.css'):
              for m in re.finditer(r'box-shadow\s*:\s*([^;}]*)', code(f)):
                  v = m.group(1).strip()
                  if v != 'none' and not v.startswith('inset'):
                      print(f'FAIL {f}: outer box-shadow: {v}'); bad = True
          for f in glob.glob('themes/**/*.css', recursive=True):
              if re.search(r'\btransparent\b', code(f)):
                  print(f'FAIL {f}: `transparent` keyword'); bad = True
          sys.exit(1 if bad else 0)
          PY

      # theme-apply.sh only ever touches a theme file behind an `if [ -f ... ]`
      # guard — that is what lets a theme omit one, and also what makes a
      # reference to a file NO theme ships anymore completely silent. It never
      # errors, never runs, and reads as live code forever. This turns that rot
      # into a build failure.
      #
      # `# optional-override` marks the deliberate case: a path expected to be
      # absent, because the shared default at the repo root is the norm and the
      # per-theme copy is opt-in (wlogout/layout is the current example).
      - name: theme-apply.sh references no dead theme paths
        run: |
          grep -o '\$CUR/[A-Za-z0-9_./-]*' \
            <(grep -v 'optional-override' scripts/theme-apply.sh) \
            | sed 's|^\$CUR/||' | sort -u \
          | while read -r p; do
              if ls themes/*/"$p" >/dev/null 2>&1; then
                echo "OK    $p"
              else
                echo "STALE $p — referenced by theme-apply.sh, shipped by no theme"
                exit 1
              fi
            done

      # ---- QML shell (quickshell/) --------------------------------------------
      # Everything below guards the QML scaffold and the palette contract it
      # depends on. None of it can affect a running desktop; it exists so the
      # additions are held to the same standard as the rest of the tree.

      - name: Palette schema + every role present
        run: |
          python3 - <<'PY'
          import glob, json, os, sys, jsonschema
          schema = json.load(open('schema/palette.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          # islink: themes/current is a symlink to the active theme and is
          # gitignored machine state. It does not exist in a fresh clone, but it
          # does locally, where it would fail the name-matches-directory check.
          files = sorted(f for f in glob.glob('themes/*/palette.json')
                         if not os.path.islink(f.rsplit('/', 1)[0]))
          if not files:
              print('FAIL: no themes/*/palette.json'); sys.exit(1)
          bad = False
          for f in files:
              d = json.load(open(f))
              try:
                  jsonschema.validate(d, schema)
              except jsonschema.ValidationError as e:
                  print(f'FAIL {f}: {e.message} at {list(e.absolute_path)}'); bad = True; continue
              # the directory name is the identity; a mismatch makes the wrong
              # palette load silently through the `current` symlink
              want = f.split('/')[1]
              if d['name'] != want:
                  print(f'FAIL {f}: name is {d["name"]!r} but lives in themes/{want}/'); bad = True
              # tokens are documentation, but a token pointing at a role that
              # does not exist means the lineage comment is lying
              for tok, role in d.get('tokens', {}).items():
                  if role not in d['roles']:
                      print(f'FAIL {f}: token {tok!r} -> unknown role {role!r}'); bad = True
              print('OK', f, f'({len(d["roles"])} roles)')
          sys.exit(1 if bad else 0)
          PY

      # palette.json is CANONICAL for color, but theme.lua keeps its own literals
      # (it is read by Hyprland directly, and by theme-lib.sh's sed). Nothing
      # stops the two drifting except this: every color theme.lua names must be a
      # color the palette declares. Without it, "canonical" is aspirational.
      - name: theme.lua colors are drawn from palette.json
        run: |
          python3 - <<'PY'
          import glob, json, os, re, sys
          bad = False
          # A shadow with no hue is a design choice, not palette drift: gruvbox
          # declares 0x59000000 precisely because it has no glow ("no color
          # cast"), where cyberpunk's shadow IS its pink bloom. Pure neutrals are
          # therefore always allowed; any other color must name a role.
          NEUTRAL = {'000000', 'ffffff'}
          for pal in sorted(glob.glob('themes/*/palette.json')):
              theme_dir = pal.rsplit('/', 1)[0]
              if os.path.islink(theme_dir):
                  continue
              lua = f'{theme_dir}/theme.lua'
              known = {v.lower().lstrip('#') for v in json.load(open(pal))['roles'].values()}
              src = open(lua).read()
              # active_border colors, inactive_border: rgba(RRGGBBAA)
              used = [(m.group(1), 'rgba') for m in re.finditer(r'rgba\(([0-9a-fA-F]{6})[0-9a-fA-F]{2}\)', src)]
              # shadow color: 0xAARRGGBB
              used += [(m.group(1), 'shadow') for m in re.finditer(r'0x[0-9a-fA-F]{2}([0-9a-fA-F]{6})', src)]
              for hexv, kind in used:
                  if hexv.lower() in known or hexv.lower() in NEUTRAL:
                      print(f'OK    {lua}: #{hexv} ({kind})')
                  else:
                      print(f'FAIL  {lua}: #{hexv} ({kind}) is in no role of {pal}')
                      bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: Shell settings schema, and every module placed
        run: |
          python3 - <<'PY'
          import json, sys, jsonschema
          schema = json.load(open('schema/shell-settings.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          cfg = json.load(open('quickshell/settings.json'))
          jsonschema.validate(cfg, schema)
          defined = set(cfg['modules'])
          placed = {m for side in cfg['bar']['islands'].values() for m in side}
          bad = False
          # A module placed but undefined gets no settings; one defined but never
          # placed is dead config. Both are silent today.
          for m in sorted(placed - defined):
              print(f'FAIL: {m!r} is on the bar but has no entry in "modules"'); bad = True
          for m in sorted(defined - placed):
              print(f'FAIL: {m!r} is configured but on no island'); bad = True
          # and each one needs a file
          import os
          for m in sorted(placed):
              qml = f'quickshell/modules/{m[0].upper()}{m[1:]}.qml'
              if not os.path.isfile(qml):
                  print(f'FAIL: {m!r} has no {qml}'); bad = True
          print(f'checked {len(placed)} modules')
          sys.exit(1 if bad else 0)
          PY

      # The QML bar and waybar read SEPARATE config files and will until the
      # switch (see docs/qml-migration.md). That duplication is deliberate, but
      # it must not drift: a tuned interval in one and not the other is exactly
      # the kind of difference nobody notices until the bars disagree.
      - name: QML settings match waybar's intervals and thresholds
        run: |
          python3 - <<'PY'
          import json, json5, sys
          wb = json5.load(open('waybar/config.jsonc'))
          qs = json.load(open('quickshell/settings.json'))['modules']
          checks = [
              ('updates',     'intervalSec', wb['custom/updates']['interval']),
              ('aur',         'intervalSec', wb['custom/aur']['interval']),
              ('agenda',      'intervalSec', wb['custom/agenda']['interval']),
              ('todos',       'intervalSec', wb['custom/todos']['interval']),
              ('temperature', 'criticalC',   wb['temperature']['critical-threshold']),
              ('battery',     'warnPercent', wb['battery']['states']['warning']),
              ('battery',     'criticalPercent', wb['battery']['states']['critical']),
              ('tray',        'spacing',     wb['tray']['spacing']),
          ]
          bad = False
          for mod, key, want in checks:
              got = qs.get(mod, {}).get(key)
              if got == want:
                  print(f'OK    {mod}.{key} = {got}')
              else:
                  print(f'FAIL  {mod}.{key} is {got} but waybar says {want}'); bad = True
          sys.exit(1 if bad else 0)
          PY

      # Every script the QML shell shells out to must exist — the same rot the
      # "Every referenced script exists" step above catches for waybar.
      - name: QML shell references no missing scripts
        run: |
          bad=0
          for name in $(grep -rhoP 'script: "\K[A-Za-z0-9._-]+\.sh' quickshell/ | sort -u); do
            if [ -f "scripts/$name" ]; then
              echo "OK    scripts/$name"
            else
              echo "FAIL  quickshell/ references missing scripts/$name"; bad=1
            fi
          done
          exit $bad

      # qmllint over the shell AND the two SDDM greeters, which nothing linted
      # before. The two disabled categories are Quickshell's C++-declared types,
      # which static analysis cannot see through (PanelWindow reads as
      # uncreatable, BluetoothAdapter as unresolved) — both work at runtime. The
      # `unqualified` category, which catches real delegate-scope bugs, stays on.
      - name: qmllint
        run: |
          QMLLINT=pyside6-qmllint
          "$QMLLINT" --uncreatable-type disable --unresolved-type disable \
            -I quickshell \
            quickshell/shell.qml quickshell/config/*.qml quickshell/bar/*.qml \
            quickshell/components/*.qml quickshell/modules/*.qml
          # The greeters' globals (config, sddm, userModel, sessionModel) are
          # injected by SDDM at runtime and cannot be resolved statically.
          "$QMLLINT" --unqualified disable themes/*/sddm/Main.qml

      # The scaffold must stay a scaffold: nothing may start it. If this fails,
      # the QML shell has become load-bearing and the "no effect on the running
      # desktop" promise no longer holds.
      - name: QML shell is not autostarted
        run: |
          bad=0
          for f in hyprland.lua scripts/theme-apply.sh scripts/theme-switch.sh; do
            if grep -nE '(^|[^[:alnum:]_])(qs|quickshell)([^[:alnum:]_]|$)' "$f"; then
              echo "FAIL $f references the QML shell — it is meant to be launched by hand only"
              bad=1
            fi
          done
          [ $bad -eq 0 ] && echo "OK: nothing autostarts quickshell/"
          exit $bad
